name: Compose Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Five-service end-to-end flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: tc03-integration
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the Compose stack
        run: bash scripts/test-compose.sh
      - name: Container status
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yaml -f docker-compose.integration.yaml ps -a
      - name: Diagnostic logs
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.yaml -f docker-compose.integration.yaml logs --no-color --tail=100
      - name: Remove disposable test containers and volumes
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yaml -f docker-compose.integration.yaml down -v --remove-orphans
