name: Foundation Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed files for credentials
        run: bash scripts/security-check.sh

  python-quality:
    name: Python / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [analytics-service, flag-service, targeting-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies and quality tools
        run: pip install -r requirements.txt ruff bandit pytest
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Lint
        run: ruff check .
      - name: SAST
        run: bandit -q -r . -x tests -ll
      - name: Tests
        run: pytest -q || test $? -eq 5

  go-quality:
    name: Go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, evaluation-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...

  container-build:
    name: Container / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - auth-service
          - evaluation-service
          - flag-service
          - targeting-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build -t "${{ matrix.service }}:${{ github.sha }}" "services/${{ matrix.service }}"

  yaml-validation:
    name: YAML manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse every YAML document
        run: |
          pip install PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml'))
          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  list(yaml.safe_load_all(stream))
          print(f'{len(paths)} arquivos YAML válidos')
          PY
