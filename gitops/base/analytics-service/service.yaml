# ============================================================
# SERVICE - analytics-service
# ============================================================
# Este servico e um worker: ninguem o chama. O Service existe apenas
# para dar um endereco estavel ao /health e para o servico aparecer no
# inventario do ArgoCD junto com os outros quatro (O-32).
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: analytics-service
  labels:
    app: analytics-service

spec:
  type: ClusterIP

  selector:
    app: analytics-service

  ports:
    - name: http
      port: 8005
      targetPort: 8005
      protocol: TCP
