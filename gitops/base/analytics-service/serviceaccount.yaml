# ============================================================
# SERVICEACCOUNT - analytics-service (IRSA)
# ============================================================
# Mesmo mecanismo explicado em
# base/evaluation-service/serviceaccount.yaml, mas com permissoes
# diferentes: o analytics precisa LER e APAGAR da fila SQS e ESCREVER na
# tabela DynamoDB, enquanto o evaluation so precisa PUBLICAR na fila.
#
# Sao duas roles distintas, cada uma com o minimo necessario (S-06).
# Se o analytics fosse comprometido, o atacante nao conseguiria publicar
# eventos falsos; se o evaluation fosse, nao conseguiria apagar a fila.
# ============================================================

apiVersion: v1
kind: ServiceAccount

metadata:
  # Referenciado pelo serviceAccountName do deployment.
  name: analytics-service
  labels:
    app: analytics-service

  # ARN da role injetado pelo patch do overlay, apos o apply da Etapa 2.
  # Ver overlays/prod/patches/irsa.yaml.
  annotations: {}
