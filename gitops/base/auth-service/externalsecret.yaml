# ============================================================
# EXTERNALSECRET - auth-service
# ============================================================
# ESTE ARQUIVO SUBSTITUI O secret.yaml DA FASE 2.
#
# Na Fase 2, o secret.yaml versionado continha a URL do banco com um
# placeholder que alguem preenchia a mao antes do kubectl apply. Isso e
# exatamente a dor descrita no enunciado: "as credenciais do banco de
# dados estao sendo passadas em arquivos de texto sem seguranca".
#
# Aqui nao ha valor nenhum no Git. Este manifesto apenas DESCREVE de
# onde o segredo deve vir. O External Secrets Operator (ESO) le o AWS
# Secrets Manager e cria o Secret do Kubernetes em tempo de execucao.
#
# PRE-REQUISITO: o ESO precisa estar instalado no cluster (Etapa 3 do
# Terraform, P-029). Sem ele o tipo ExternalSecret nem existe na API e
# o ArgoCD acusa "no matches for kind". Como o ArgoCD tambem so chega na
# Etapa 3, nao ha janela em que isto quebre.
# ============================================================

# CRD (recurso customizado) instalado pelo ESO, nao faz parte do
# Kubernetes padrao.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: auth-service-secret
  labels:
    app: auth-service

spec:
  # De quanto em quanto tempo o ESO reconsulta a AWS. Se a senha for
  # rotacionada no Secrets Manager, o Secret do cluster acompanha sozinho
  # em ate uma hora - sem ninguem rodar comando.
  refreshInterval: 1h

  # Aponta para a configuracao de acesso a AWS.
  secretStoreRef:
    # Nome do ClusterSecretStore criado no overlay.
    name: aws-secretsmanager
    # ClusterSecretStore e cluster-wide; SecretStore seria por namespace.
    kind: ClusterSecretStore

  # Descreve o Secret do Kubernetes que sera CRIADO por este recurso.
  target:
    # Precisa bater com o secretKeyRef.name do deployment.yaml.
    name: auth-service-secret
    # Owner: se este ExternalSecret for apagado, o Secret vai junto.
    # Evita segredo orfao sobrando no cluster.
    creationPolicy: Owner

  # Quais chaves buscar e de onde.
  data:
    # Nome da chave DENTRO do Secret do Kubernetes.
    - secretKey: DATABASE_URL
      remoteRef:
        # Nome do segredo no AWS Secrets Manager, criado pelo Terraform
        # da Etapa 2 a partir de um random_password.
        key: togglemaster/auth-service
        # O segredo na AWS e um JSON; esta e a propriedade a extrair.
        property: DATABASE_URL

    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/auth-service
        property: MASTER_KEY
