# ============================================================
# EXTERNALSECRET - evaluation-service
# ============================================================
# COMPARE COM A FASE 2: o secret.yaml original tinha 4 chaves -
# SERVICE_API_KEY, AWS_SQS_URL, AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY.
# Aqui sobra UMA.
#
# As duas chaves da AWS sumiram porque o acesso a SQS passou a ser por
# IRSA (ver serviceaccount.yaml). A AWS_SQS_URL saiu do Secret porque
# nunca foi segredo de verdade: e um endereco publico, e agora vive no
# ConfigMap, injetada pelo overlay a partir do output do Terraform.
#
# De 4 segredos para 1. Isso e o que o enunciado pede quando fala em
# "credenciais em arquivos de texto sem seguranca".
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: evaluation-service-secret
  labels:
    app: evaluation-service

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: evaluation-service-secret
    creationPolicy: Owner

  data:
    # Chave interna usada para autenticar nas chamadas a flag e targeting.
    # Este sim e segredo de aplicacao e continua no Secrets Manager.
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: togglemaster/evaluation-service
        property: SERVICE_API_KEY
