# ============================================================
# SERVICEACCOUNT - evaluation-service (IRSA)
# ============================================================
# ESTE ARQUIVO E O CORACAO DA CORRECAO DE SEGURANCA DA FASE 3.
#
# Na Fase 2, este servico recebia AWS_ACCESS_KEY_ID e
# AWS_SECRET_ACCESS_KEY como variaveis de ambiente, vindas de um Secret
# do Kubernetes (F-017). Uma chave permanente, dentro do cluster, que
# ninguem rotacionava.
#
# Com IRSA (IAM Roles for Service Accounts), o pod nao recebe chave
# nenhuma. O EKS injeta um token de identidade de curta duracao, o SDK
# da AWS troca esse token por credenciais temporarias, e elas expiram
# sozinhas. Nao ha o que vazar.
#
# Mesmo principio do OIDC usado no CI (modules/iam-ci), aplicado agora
# aos pods em vez do pipeline.
# ============================================================

apiVersion: v1
kind: ServiceAccount

metadata:
  # Nome referenciado pelo campo serviceAccountName do deployment.
  name: evaluation-service
  labels:
    app: evaluation-service

  # A anotacao com o ARN da role e o que liga a ServiceAccount ao IAM.
  # Ela NAO esta aqui de proposito: o ARN so existe depois do
  # `terraform apply` da Etapa 2, e e injetado pelo patch em
  # overlays/prod/patches/irsa.yaml.
  #
  # Deixar um ARN falso na base seria pior: o pod subiria, tentaria
  # assumir uma role inexistente e falharia com AccessDenied em runtime,
  # que e um erro bem mais dificil de diagnosticar.
  annotations: {}
