# ============================================================
# EXTERNALSECRET - flag-service
# ============================================================
# Busca no AWS Secrets Manager a URL de conexao com o RDS `flags_db`.
# Ver base/auth-service/externalsecret.yaml para a explicacao completa
# do mecanismo e do pre-requisito (ESO instalado na Etapa 3).
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: flag-service-secret
  labels:
    app: flag-service

spec:
  # Reconsulta a AWS a cada hora para acompanhar rotacao de senha.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    # Precisa bater com o secretKeyRef.name do deployment.
    name: flag-service-secret
    creationPolicy: Owner

  data:
    - secretKey: DATABASE_URL
      remoteRef:
        # Segredo criado pelo Terraform da Etapa 2.
        key: togglemaster/flag-service
        property: DATABASE_URL
