# ============================================================
# EXTERNALSECRET - postgres-targeting
# ============================================================
# Traz usuario e senha do banco em pod a partir do AWS Secrets Manager.
#
# PONTO IMPORTANTE: le o MESMO segredo da AWS que o
# targeting-service/externalsecret.yaml (togglemaster/targeting-db).
# O banco pega POSTGRES_USER e POSTGRES_PASSWORD; a aplicacao pega a
# DATABASE_URL ja montada. Como a fonte e unica, e impossivel o banco
# subir com uma senha e a aplicacao tentar outra - erro classico quando
# as duas pontas sao preenchidas a mao, como era na Fase 2.
#
# O Terraform da Etapa 2 gera a senha com random_password e grava as
# tres propriedades nesse mesmo segredo.
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: postgres-targeting-secret
  labels:
    app: postgres-targeting

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    # Nome referenciado pelo secretKeyRef do StatefulSet.
    name: postgres-targeting-secret
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: togglemaster/targeting-db
        property: POSTGRES_USER

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: togglemaster/targeting-db
        property: POSTGRES_PASSWORD
