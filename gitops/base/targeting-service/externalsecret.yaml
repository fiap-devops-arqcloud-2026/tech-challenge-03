# ============================================================
# EXTERNALSECRET - targeting-service
# ============================================================
# Diferente de auth e flag, o segredo aqui NAO aponta para um RDS: a
# URL montada no Secrets Manager referencia o Service interno
# postgres-targeting:5432 (D-015).
#
# A senha e a mesma consumida pelo StatefulSet em
# base/postgres-targeting/ - as duas pontas leem o MESMO segredo da AWS,
# o que impede que banco e aplicacao fiquem com senhas diferentes.
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: targeting-service-secret
  labels:
    app: targeting-service

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: targeting-service-secret
    creationPolicy: Owner

  data:
    - secretKey: DATABASE_URL
      remoteRef:
        # Mesmo segredo lido pelo banco em pod, para as senhas nunca
        # divergirem.
        key: togglemaster/targeting-db
        # Propriedade com a URL completa apontando para o Service interno.
        property: DATABASE_URL
