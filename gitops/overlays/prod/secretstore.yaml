# ============================================================
# CLUSTERSECRETSTORE - acesso ao AWS Secrets Manager
# ============================================================
# Todo ExternalSecret da base aponta para este objeto pelo nome
# "aws-secretsmanager". Ele responde a pergunta: "de qual conta, em qual
# regiao e com qual identidade eu leio os segredos?".
#
# ClusterSecretStore (e nao SecretStore) porque e cluster-wide: um unico
# objeto serve a todos os namespaces. Com um namespace so faria pouca
# diferenca, mas evita reescrever o mesmo bloco se o projeto crescer.
#
# PRE-REQUISITO: o External Secrets Operator precisa estar instalado
# (Etapa 3 do Terraform, P-029). Ele que registra este tipo de recurso
# na API do Kubernetes.
# ============================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore

metadata:
  # Nome referenciado por todos os secretStoreRef da base.
  name: aws-secretsmanager

spec:
  provider:
    # Provedor AWS. O ESO tambem suporta Vault, GCP e outros.
    aws:
      # SecretsManager, e nao ParameterStore. Foi a escolha de D-013:
      # o Secrets Manager suporta rotacao automatica e guarda JSON com
      # varias propriedades, que e como os segredos deste projeto sao
      # organizados (uma entrada por servico, varias chaves dentro).
      service: SecretsManager

      # Regiao onde os segredos vivem (F-012).
      region: us-east-2

      auth:
        # O ESO tambem usa IRSA para falar com a AWS - mesmo mecanismo
        # dos pods de aplicacao. Nao ha access key em lugar nenhum da
        # cadeia: nem no CI, nem nos pods, nem no operador de segredos.
        jwt:
          serviceAccountRef:
            # ServiceAccount criada pelo Helm chart do ESO na Etapa 3.
            name: external-secrets
            # Namespace onde o operador e instalado.
            namespace: external-secrets
